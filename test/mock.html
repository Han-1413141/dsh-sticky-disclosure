<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-sticky-disclosure mock harness</title>
<style>
  :root {
    --dsw-alias-border-l1: rgba(60, 70, 90, 0.18);
    --dsw-specific-tip: #ffffff;
    --dsw-alias-label-primary: #1a1f2e;
    --dsw-alias-label-secondary: #4a5568;
    --dsw-alias-label-tertiary: #8a94a6;
    --dsw-alias-interactive-bg-hover: rgba(30, 40, 60, 0.06);
    --dsw-alias-state-business-primary: #4d6bfe;
    --dsw-shadow-lv2: 0 6px 16px rgba(20, 30, 60, 0.12);
    --dsw-font-xxs-12: 12px/18px Inter, sans-serif;
    --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; height: 100vh;
    background: #f4f6fa; font-family: Inter, sans-serif;
  }
  .app-frame { display: flex; flex: 1; min-height: 0; }
  .center-col { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fbfcfe; }
  .header-strip { height: 56px; flex: none; border-bottom: 1px solid #e3e8f0; padding: 0 32px; display: flex; align-items: center; font-weight: 600; }
  .scrollport {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 16px 32px; box-sizing: border-box;
  }
  .column { max-width: 748px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .block { border: 1px solid #e3e8f0; border-radius: 10px; background: #fff; padding: 10px 14px; }
  .block .body { display: none; margin-top: 8px; color: #6b7488; white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
  [data-disclosure-row] + .body { display: block; }
  .block .filler { color: #3c465e; padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
  .row:hover { background: rgba(30,40,60,.04); border-radius: 6px; }
  .composer-seat { padding: 8px 0 40px; }
  .composer-card { border: 1px solid #dbe2ee; border-radius: 16px; padding: 10px 16px; background: #fff; font-size: 13px; color: #6b7488; }
</style>
</head>
<body>
  <div class="app-frame">
    <div class="center-col">
      <div class="header-strip">会话标题 / Session header</div>
      <div class="scrollport" id="scrollport" data-conversation-scroll="">
        <div class="column" id="column">
          <div class="block" data-variant="think" data-state="ok" id="b1">
            <div data-open data-root>
              <div class="row" data-disclosure-row data-expandable tabindex="0" role="button" aria-expanded="true">
                <span class="leading">⌄</span><span class="title">Think</span><span class="summary">关于第一段思考的摘要</span>
              </div>
              <div class="body" style="height:1000px">第一段展开的思考内容（固定高度 1000px）。</div>
            </div>
            <div class="filler">助手消息正文 A</div>
          </div>
          <div class="block" data-variant="think" data-state="ok" id="b2">
            <div data-root>
              <div class="row" data-disclosure-row data-expandable tabindex="0" role="button" aria-expanded="false">
                <span class="leading">›</span><span class="title">Think</span><span class="summary">第二段（收起状态，不应出 chip）</span>
              </div>
              <div class="body" style="height:100px">第二段思考内容。</div>
            </div>
            <div class="filler">助手消息正文 B</div>
          </div>
          <div class="block" data-variant="tool" data-tool="pwsh" data-state="ok" id="b3">
            <div data-open data-root>
              <div class="row" data-disclosure-row data-expandable tabindex="0" role="button" aria-expanded="true">
                <span class="leading">⌄</span><span class="title">pwsh</span><span class="summary">List directory</span>
              </div>
              <div class="body" style="height:600px">工具输出内容……</div>
            </div>
            <div class="filler">助手消息正文 C</div>
          </div>
          <div class="block" data-variant="others" data-state="ok" id="b4">
            <div data-open data-root>
              <div class="row" data-disclosure-row tabindex="0" aria-expanded="true">
                <button class="leading" type="button" aria-expanded="true">⌄</button><span class="title">compact</span>
              </div>
              <div class="body" style="height:500px">命令卡片内容（无 data-expandable，靠按钮收起）。</div>
            </div>
            <div class="filler">助手消息正文 D</div>
          </div>
          <div class="block" data-variant="think" id="b5">
            <div data-open data-root>
              <div class="row" data-disclosure-row data-expandable tabindex="0" role="button" aria-expanded="true">
                <span class="leading">⌄</span><span class="title">Think</span><span class="summary">末尾段</span>
              </div>
              <div class="body" style="height:300px">末尾展开内容。</div>
            </div>
            <div class="filler">助手消息正文 E</div>
          </div>
          <div class="filler" style="height:400px">spacer，保证滚动余量</div>
          <div class="composer-seat" data-composer-seat="">
            <div class="composer-card">
              输入框（模拟）<br>
              <input id="composer-input" type="text" placeholder="在输入框聚焦时快捷键也应生效" style="width:90%;margin:6px 0" />
              <div data-open data-root>
                <div class="row" data-disclosure-row data-expandable tabindex="0" role="button" aria-expanded="true">
                  <span class="leading">⌄</span><span class="title">ComposerPanel</span>
                </div>
                <div class="body">composer 内部展开面板——应当永远不出 chip。</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    // --- DSH boot protocol stub: register the module table before the bundle ---
    window.__ModuleLoader__ = { load(handoff) { window.__handoff = handoff; } };
  </script>
  <script src="../lib/client.js"></script>
  <script>
    // --- Minimal cordis client context, mirroring the web shell surface used ---
    (function () {
      const exports = window.__handoff.factory(function require(spec) {
        throw new Error("unexpected require: " + spec);
      });
      const ctx = {
        effect(fn, label) {
          const cleanup = fn();
          const handle = { label, dispose: () => cleanup && cleanup() };
          window.__effectHandle = handle;
          return handle;
        },
        logger: { warn: (...a) => console.warn("[ctx]", ...a), error: (...a) => console.error("[ctx]", ...a) },
      };
      window.__plugin = exports;
      window.__pluginCtx = ctx;
      exports.apply(ctx);
      console.log("plugin applied:", exports.name);
    })();

    // --- Mock DisclosureRow behavior (mirrors the app's React onClick) ---
    document.addEventListener("click", (event) => {
      const row = event.target.closest("[data-disclosure-row]");
      if (!row) return;
      const root = row.parentElement;
      const body = row.nextElementSibling;
      const togglable = row.hasAttribute("data-expandable") ||
        (event.target.closest("button[aria-expanded]") !== null && row.querySelector("button[aria-expanded]") !== null);
      if (!togglable) return;
      const next = !root.hasAttribute("data-open");
      if (next) root.setAttribute("data-open", "");
      else root.removeAttribute("data-open");
      if (body) body.style.display = next ? "block" : "none";
      row.setAttribute("aria-expanded", String(next));
      const btn = row.querySelector("button[aria-expanded]");
      if (btn) btn.setAttribute("aria-expanded", String(next));
    });
  </script>
</body>
</html>
